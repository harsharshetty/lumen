name: Deploy prod

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

env:
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Deploy backend to Render
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK_URL }}
        run: |
          test -n "$DEPLOY_HOOK"
          curl --fail-with-body --silent --show-error --request POST "$DEPLOY_HOOK"

      - name: Deploy frontend to Render
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK_URL }}
        run: |
          test -n "$DEPLOY_HOOK"
          curl --fail-with-body --silent --show-error --request POST "$DEPLOY_HOOK"
