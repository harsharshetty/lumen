name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Build, test and enforce backend coverage
        run: mvn --batch-mode verify

  postgres-persistence:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: lumen
          POSTGRES_USER: lumen
          POSTGRES_PASSWORD: lumen
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lumen -d lumen"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/lumen
      DATABASE_USERNAME: lumen
      DATABASE_PASSWORD: lumen
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify Flyway and persistence constraints on PostgreSQL
        run: mvn --batch-mode -Dtest=PostgresPersistenceIntegrationTest test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Audit frontend dependencies
        run: npm audit --audit-level=high
      - name: Type check
        run: npm run typecheck
      - name: Test and enforce frontend coverage
        run: npm run test:coverage
      - name: Build frontend
        run: npm run build
      - name: Verify authoritative frozen-screen sources and production assets
        run: |
          printf '%s  %s\n' \
            'e3ebb11145b172714e5549272213720020cd72baba5a25843b6b059bc19683c6' 'src/assets/frozen/signin-hero-approved.png' \
            '1678ae7f469d0530e87c500943b6b868190db6fb7dd58c2fceadcaf06a7bbe3d' 'src/assets/frozen/parent-home-approved.png' \
            '44321821253693fa371da4f5eefab75a8444f7cfa35cd98775808c22e594583b' 'src/assets/frozen/learner-avatars-approved.png' \
            | sha256sum --check --strict
          for asset in signin-hero-approved parent-home-approved learner-avatars-approved; do
            if ! find dist/assets -type f -name "${asset}-*.png" -size +0c | grep --quiet .; then
              echo "Authoritative frozen-screen asset ${asset} is missing from the production build" >&2
              exit 1
            fi
          done

  controller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: '3.12'
      - name: Test thread execution controller and lane worker
        run: python -m unittest discover -s scripts -p 'test_*worker.py' && python -m unittest discover -s scripts -p 'test_thread_execution_controller.py'

  source-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Scan committed secrets and configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_OFFLINE_SCAN: 'true'
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          languages: java-kotlin,javascript-typescript
      - name: Autobuild compiled languages
        uses: github/codeql-action/autobuild@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
      - name: Analyze source
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4

  container:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: lumen
          POSTGRES_USER: lumen
          POSTGRES_PASSWORD: lumen
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lumen -d lumen"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '20'
      - name: Build production image
        run: docker build --tag lumen-backend:ci .
      - name: Scan production image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: lumen-backend:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
      - name: Start production image
        run: |
          docker run --detach --name lumen-ui-ci --network host \
            -e DATABASE_URL=jdbc:postgresql://127.0.0.1:5432/lumen \
            -e DATABASE_USERNAME=lumen \
            -e DATABASE_PASSWORD=lumen \
            -e PORT=8080 \
            lumen-backend:ci
          for attempt in $(seq 1 75); do
            if curl --fail --silent http://127.0.0.1:8080/actuator/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs lumen-ui-ci
          exit 1
      - name: Install visual acceptance dependencies
        working-directory: e2e
        run: npm install --no-audit --no-fund
      - name: Install Chromium for visual acceptance
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Validate production UI on desktop and mobile
        working-directory: e2e
        env:
          BASE_URL: http://127.0.0.1:8080
        run: npx playwright test --config=playwright.visual.config.ts
      - name: Upload production UI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-ui-evidence
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Show production container logs
        if: failure()
        run: docker logs lumen-ui-ci || true
      - name: Stop production image
        if: always()
        run: docker rm --force lumen-ui-ci || true

  e2e:
    needs: [backend, frontend, postgres-persistence, controller, source-security, codeql, container]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: lumen
          POSTGRES_USER: lumen
          POSTGRES_PASSWORD: lumen
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lumen -d lumen"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/lumen
      DATABASE_USERNAME: lumen
      DATABASE_PASSWORD: lumen
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '20'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Install E2E dependencies
        working-directory: e2e
        run: npm install --no-audit --no-fund
      - name: Audit E2E dependencies
        working-directory: e2e
        run: npm audit --audit-level=high
      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Run Playwright E2E
        working-directory: e2e
        run: npm test
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-diagnostics
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
          retention-days: 7
