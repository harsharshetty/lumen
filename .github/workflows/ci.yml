name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build, test and enforce backend coverage
        run: mvn --batch-mode verify
      - name: Publish backend behavioral signal
        if: always()
        run: |
          echo "## Backend unit/API + coverage" >> "$GITHUB_STEP_SUMMARY"
          echo "- Required gate: \`mvn verify\` (tests + repository coverage thresholds)" >> "$GITHUB_STEP_SUMMARY"
          unit_classes=$(find src/test/java -name '*Test.java' ! -name '*IntegrationTest.java' | wc -l | tr -d ' ')
          integration_classes=$(find src/test/java -name '*IntegrationTest.java' | wc -l | tr -d ' ')
          echo "- Unit/boundary test classes: ${unit_classes}" >> "$GITHUB_STEP_SUMMARY"
          echo "- API/integration test classes: ${integration_classes}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Count convention: test classes by repository naming convention; parameterized invocations are not inflated as independent scenarios." >> "$GITHUB_STEP_SUMMARY"
          if [ -f target/site/jacoco/jacoco.csv ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import csv
          from pathlib import Path
          rows = list(csv.DictReader(Path('target/site/jacoco/jacoco.csv').open()))
          for kind in ('LINE', 'BRANCH'):
              missed = sum(int(row[f'{kind}_MISSED']) for row in rows)
              covered = sum(int(row[f'{kind}_COVERED']) for row in rows)
              total = missed + covered
              pct = 100.0 * covered / total if total else 100.0
              print(f'- Raw JaCoCo {kind.lower()} coverage: {pct:.2f}% ({covered}/{total})')
          PY
          fi
          echo "- Behavioral traceability: [docs/quality/behavioral-test-matrix.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/docs/quality/behavioral-test-matrix.md)" >> "$GITHUB_STEP_SUMMARY"

  postgres-persistence:
    name: PostgreSQL/Flyway persistence
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: lumen
          POSTGRES_USER: lumen
          POSTGRES_PASSWORD: lumen
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lumen -d lumen"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/lumen
      DATABASE_USERNAME: lumen
      DATABASE_PASSWORD: lumen
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify Flyway and persistence constraints on PostgreSQL
        run: mvn --batch-mode -Dtest=PostgresPersistenceIntegrationTest test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Test and enforce frontend coverage
        run: npm run test:coverage
      - name: Publish frontend behavioral signal
        if: always()
        run: |
          echo "## Frontend component + coverage" >> "$GITHUB_STEP_SUMMARY"
          echo "- Required gate: \`npm run test:coverage\` (component tests + repository coverage thresholds)" >> "$GITHUB_STEP_SUMMARY"
          component_modules=$(find src -name '*.test.ts' -o -name '*.test.tsx' | wc -l | tr -d ' ')
          echo "- Component test modules: ${component_modules}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Count convention: test modules, not individual/parameterized invocations, so parameterization cannot inflate the signal." >> "$GITHUB_STEP_SUMMARY"
          if [ -f coverage/coverage-summary.json ]; then
            node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const summary = require('./coverage/coverage-summary.json').total;
          console.log(`- Raw frontend line coverage: ${summary.lines.pct}% (${summary.lines.covered}/${summary.lines.total})`);
          console.log(`- Raw frontend branch coverage: ${summary.branches.pct}% (${summary.branches.covered}/${summary.branches.total})`);
          NODE
          fi
          echo "- Behavioral traceability: [docs/quality/behavioral-test-matrix.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/docs/quality/behavioral-test-matrix.md)" >> "$GITHUB_STEP_SUMMARY"
      - name: Build frontend
        run: npm run build
      - name: Verify authoritative frozen-screen sources and production assets
        run: |
          printf '%s  %s\n' \
            'e3ebb11145b172714e5549272213720020cd72baba5a25843b6b059bc19683c6' 'src/assets/frozen/signin-hero-approved.png' \
            '1678ae7f469d0530e87c500943b6b868190db6fb7dd58c2fceadcaf06a7bbe3d' 'src/assets/frozen/parent-home-approved.png' \
            '44321821253693fa371da4f5eefab75a8444f7cfa35cd98775808c22e594583b' 'src/assets/frozen/learner-avatars-approved.png' \
            | sha256sum --check --strict
          for asset in signin-hero-approved parent-home-approved learner-avatars-approved; do
            if ! find dist/assets -type f -name "${asset}-*.png" -size +0c | grep --quiet .; then
              echo "Authoritative frozen-screen asset ${asset} is missing from the production build" >&2
              exit 1
            fi
          done

  controller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test thread execution controller and lane worker
        run: python -m unittest discover -s scripts -p 'test_*worker.py' && python -m unittest discover -s scripts -p 'test_thread_execution_controller.py'

  container:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: lumen
          POSTGRES_USER: lumen
          POSTGRES_PASSWORD: lumen
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lumen -d lumen"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build production image
        run: docker build --tag lumen-backend:ci .
      - name: Start production image
        run: |
          docker run --detach --name lumen-ui-ci --network host \
            -e DATABASE_URL=jdbc:postgresql://127.0.0.1:5432/lumen \
            -e DATABASE_USERNAME=lumen \
            -e DATABASE_PASSWORD=lumen \
            -e PORT=8080 \
            lumen-backend:ci
          for attempt in $(seq 1 75); do
            if curl --fail --silent http://127.0.0.1:8080/actuator/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs lumen-ui-ci
          exit 1
      - name: Install visual acceptance dependencies
        working-directory: e2e
        run: npm install --no-audit --no-fund
      - name: Install Chromium for visual acceptance
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Validate production UI on desktop and mobile
        working-directory: e2e
        env:
          BASE_URL: http://127.0.0.1:8080
        run: npx playwright test --config=playwright.visual.config.ts
      - name: Upload production UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-ui-evidence
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Show production container logs
        if: failure()
        run: docker logs lumen-ui-ci || true
      - name: Stop production image
        if: always()
        run: docker rm --force lumen-ui-ci || true

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: lumen
          POSTGRES_USER: lumen
          POSTGRES_PASSWORD: lumen
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lumen -d lumen"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/lumen
      DATABASE_USERNAME: lumen
      DATABASE_PASSWORD: lumen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Install E2E dependencies
        working-directory: e2e
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Publish Playwright scenario count
        working-directory: e2e
        run: |
          npx playwright test --list | tee /tmp/playwright-list.txt
          echo "## Playwright behavioral E2E" >> "$GITHUB_STEP_SUMMARY"
          grep '^Total:' /tmp/playwright-list.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo "- Behavioral traceability: [docs/quality/behavioral-test-matrix.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/docs/quality/behavioral-test-matrix.md)" >> "$GITHUB_STEP_SUMMARY"
      - name: Run Playwright E2E
        working-directory: e2e
        run: npm test
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
          retention-days: 7
