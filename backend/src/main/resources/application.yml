spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/lumen}
    username: ${DATABASE_USERNAME:lumen}
    password: ${DATABASE_PASSWORD:lumen}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health
