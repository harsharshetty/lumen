spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/lumen}
    username: ${DATABASE_USERNAME:lumen}
    password: ${DATABASE_PASSWORD:lumen}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:local-google-client}
            client-secret: ${GOOGLE_CLIENT_SECRET:local-google-secret}
            scope: openid,profile,email
server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
management:
  endpoints:
    web:
      exposure:
        include: health
