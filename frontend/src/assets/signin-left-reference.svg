<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1200" role="img" aria-labelledby="title desc">
  <title id="title">Lumen learning landscape</title>
  <desc id="desc">A child with a backpack looking toward a sunrise over mountains.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f57aa"/>
      <stop offset="0.55" stop-color="#766fae"/>
      <stop offset="1" stop-color="#d19aa8"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#31549a"/>
      <stop offset="1" stop-color="#16356e"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="1200" fill="#122a5b"/>
  <rect x="0" y="0" width="1000" height="535" fill="#122a5b"/>
