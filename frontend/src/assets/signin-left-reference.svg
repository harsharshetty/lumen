    <text x="500" y="212" font-size="62" font-weight="800">Lumen</text>
    <text x="500" y="302" font-size="38" font-weight="800">Bright learning for brighter</text>
    <text x="500" y="355" font-size="38" font-weight="800">tomorrows</text>
    <text x="500" y="430" font-size="25" fill="#dbe4ff">Personalised practice. Real progress.</text>
    <text x="500" y="470" font-size="25" fill="#dbe4ff">For every curious mind.</text>
  </g>
  <rect x="0" y="535" width="1000" height="665" fill="url(#sky)"/>
  <circle cx="748" cy="880" r="74" fill="#ffe37c"/>
  <g fill="#fff" opacity=".9">
