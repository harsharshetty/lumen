  </g>
  <path d="M0 900 L155 790 L265 870 L410 760 L545 880 L690 810 L1000 930 L1000 1200 L0 1200 Z" fill="#3d5fa6"/>
  <path d="M0 965 L190 840 L315 925 L515 790 L690 925 L855 835 L1000 930 L1000 1200 L0 1200 Z" fill="#274985"/>
  <path d="M0 1010 C170 965 295 1008 430 980 C590 948 720 995 1000 970 L1000 1200 L0 1200 Z" fill="url(#hill)"/>
  <path d="M640 885 C710 910 734 938 770 998 C807 1060 878 1072 942 1040" fill="none" stroke="#f1d48a" stroke-width="13" stroke-linecap="round"/>
